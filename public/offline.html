<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CallsDash is offline</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; text-align: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; color: #0f1b24; background: linear-gradient(160deg, #0e7c86, #0a5f68); }
  main { max-width: 380px; background: #fff; border-radius: 18px; padding: 2rem 1.5rem; box-shadow: 0 20px 50px rgb(0 0 0 / .25); }
  h1 { margin: .5rem 0 .25rem; font-size: 1.3rem; }
  p { margin: .25rem 0; color: #5f6d7a; }
  button { margin-top: 1rem; font: inherit; font-weight: 600; color: #fff; background: #0e7c86; border: 0; border-radius: 10px; padding: .7rem 1.4rem; min-height: 44px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Check your internet connection, then try again.</p>
  <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. تحقق من اتصالك ثم أعد المحاولة.</p>
  <button onclick="location.reload()">Try again / إعادة المحاولة</button>
</main>
</body>
</html>
